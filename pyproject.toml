[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008", # FastAPI dependency injection intentionally uses Depends() defaults.
  "E501", # Formatter/readability policy handles long URLs and legal text.
]
